name: Build Dashboard

on:
  push:
    paths:
      - 'data.json'   # data.json 이 바뀔 때만 실행
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build index.html from data.json
        run: python build_product_dashboard.py

      - name: Commit & push index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "auto: rebuild dashboard $(date +'%Y-%m-%d %H:%M')"
          git push
